<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>录像回放</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
  <main>
    <h1>录像回放</h1>
    <p class="sub">
      <a class="nav" href="/">返回实时预览</a>
      · 录像回放（开发中）
    </p>
    <div class="layout">
      <div class="panel">
        <h2>录像列表</h2>
        <div class="list" id="list"><div class="meta">加载中...</div></div>
      </div>
      <div class="player">
        <h2 id="title">未选择</h2>
        <video id="video" class="playback" controls playsinline></video>
        <div class="timeline">
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <div class="row"><span id="cur">00:00</span><span id="dur">00:00</span></div>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </main>
  <script src="/assets/js/playback.js"></script>
</body>
</html>
